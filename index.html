<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Things</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Things">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5b21b6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg1:#2a0f4d;--bg2:#5b21b6;--glow:#ffb347;--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.2);--text:#fdf6ff;--muted:#d4bdf5;--ink:#2a0f4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"],:root:not([data-theme="dark"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a0933;--bg2:#4a1a96}}
:root[data-theme="dark"]{--bg1:#1a0933;--bg2:#4a1a96}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;color:var(--text);
background:linear-gradient(135deg,var(--bg1),var(--bg2),#7c3aed,var(--bg1));background-size:300% 300%;animation:flow 14s ease infinite;overflow-x:hidden}
@keyframes flow{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(50px);opacity:.35;z-index:0;pointer-events:none;background:var(--glow);animation:float 12s ease-in-out infinite}
.orb.a{width:260px;height:260px;left:-60px;top:12%}
.orb.b{width:200px;height:200px;right:-50px;bottom:8%;animation-delay:-5s;background:#f0abfc}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-60px) scale(1.2)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(2.4rem,9vw,4rem);margin:0;line-height:1;letter-spacing:-.02em}
h1 span{display:inline-block;animation:drop .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-40px) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
h1 .gold{color:var(--glow)}
.sub{color:var(--muted);margin:10px 0 22px}
.add{display:grid;grid-template-columns:1fr 1.3fr 1.3fr auto;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;backdrop-filter:blur(10px)}
.add #name{grid-column:1/-1}
.dwrap{display:flex;flex-direction:column;gap:4px;min-width:0}
.dwrap label{font-size:.75rem;color:var(--muted);padding-left:6px}
input[type=date]{color-scheme:dark;width:100%}
input,select{font:inherit;color:var(--text);background:rgba(0,0,0,.25);border:1px solid transparent;border-radius:14px;padding:12px;min-width:0;transition:border-color .2s,transform .2s}
input::placeholder{color:var(--muted)}
input:focus,select:focus{outline:none;border-color:var(--glow);transform:scale(1.03)}
select option{color:#222}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--glow);color:var(--ink);font-weight:700;border-radius:14px;padding:12px 20px;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-3px) rotate(-2deg);box-shadow:0 8px 20px rgba(255,179,71,.5)}
.btn:active{transform:scale(.92)}
.bar{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap}
.bar input{flex:1;min-width:140px}
.count{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px;color:var(--glow);font-weight:700}
.count.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.25)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:99px;padding:6px 14px;transition:all .25s}
.chip:hover{border-color:var(--glow)}
.chip.on{background:var(--glow);color:var(--ink);border-color:var(--glow);transform:scale(1.07)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;backdrop-filter:blur(8px);animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;transition:transform .25s,box-shadow .25s}
li:hover{transform:translateX(6px) scale(1.01);box-shadow:0 0 0 1px var(--glow),0 8px 24px rgba(0,0,0,.25)}
li.out{animation:out .45s ease forwards}
@keyframes pop{from{transform:scale(.5) translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes out{to{transform:translateX(120%) rotate(8deg);opacity:0;height:0;padding:0;margin:-5px 0}}
.emo{font-size:1.9rem;animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-3px)}}
.info{flex:1;min-width:0}
.info b{display:block;overflow-wrap:anywhere}
.info small{color:var(--muted)}
.exp{position:relative;display:inline-block;margin-top:6px;font-size:.8rem;font-weight:600;border-radius:99px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);cursor:pointer}
.exp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0;transform:none!important}
li.warn{border-color:#facc15;background:rgba(250,204,21,.14)}
li.warn .exp{background:#facc15;border-color:#facc15;color:#3b2f00}
li.danger{border-color:#f87171;background:rgba(239,68,68,.22)}
li.danger .exp{background:#ef4444;border-color:#ef4444;color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:0 0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);color:var(--text);font-weight:700;transition:transform .15s,background .2s}
.qty button:hover{background:var(--glow);color:var(--ink);transform:scale(1.2)}
.qty span{min-width:24px;text-align:center;font-weight:700}
.del{background:transparent;font-size:1.3rem;transition:transform .25s}
.del:hover{transform:rotate(20deg) scale(1.3)}
.empty{text-align:center;padding:40px 10px;color:var(--muted);animation:pop .6s both}
.empty .big{font-size:3.5rem;display:block;animation:float 4s ease-in-out infinite}
.spark{position:fixed;pointer-events:none;z-index:5;width:8px;height:8px;border-radius:50%;background:var(--glow);animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@media (max-width:600px){.add{grid-template-columns:1fr 1fr}.add #name{grid-column:1/3}.add .dwrap{grid-column:1/3}.add .btn{grid-column:1/3}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<main>
<h1 id="t"></h1>
<p class="sub">Keep track of everything you own. Add it, change the amount, or remove what you no longer have.</p>
<div class="add">
<input id="name" placeholder="What is it? (e.g. Headphones)" maxlength="60">
<input id="qty" type="number" min="1" value="1" aria-label="Quantity">
<select id="cat" aria-label="Category"><option>📦 General</option><option>💊 Medicine</option><option>👕 Clothes</option><option>💻 Tech</option><option>📚 Books</option><option>🍎 Food</option><option>🎮 Games</option></select>
<div class="dwrap"><label for="exp">Expiry date (optional)</label><input id="exp" type="date"></div>
<button class="btn" id="addBtn">Add item</button>
</div>
<div class="bar"><input id="q" placeholder="Search your things"><span class="count" id="count">0 items</span></div>
<div class="bar"><span class="count" id="st">💾 Auto-save on</span><button class="chip" id="bk">⬇️ Backup</button><button class="chip" id="rs">⬆️ Restore</button><input type="file" id="fi" accept=".json" hidden></div>
<div class="legend"><span><i style="background:#facc15"></i>6 months or less to expiry</span><span><i style="background:#ef4444"></i>3 months or less, or expired</span></div>
<div class="chips" id="chips"></div>
<ul id="list"></ul>
</main>
<script>
(function(){
var KEY="my-stash-items",items=[],filter="All",$=function(i){return document.getElementById(i)};
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
var ok=true;
function save(){var st=$("st");try{localStorage.setItem(KEY,JSON.stringify(items));if(localStorage.getItem(KEY)===null)throw 0;ok=true;st.textContent="💾 Saved"}catch(e){ok=false;st.textContent="⚠️ Not saving here: tap Backup"}}
function backup(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(items)],{type:"application/json"}));a.download="my-things-backup.json";document.body.appendChild(a);a.click();a.remove()}
"My Things".split("").forEach(function(c,i){var s=document.createElement("span");s.textContent=c===" "?"\u00a0":c;s.style.animationDelay=i*.07+"s";if(i>2)s.className="gold";$("t").appendChild(s)});
function sparks(x,y){for(var i=0;i<14;i++){var d=document.createElement("i");d.className="spark";d.style.left=x+"px";d.style.top=y+"px";var a=Math.random()*6.28,r=40+Math.random()*60;d.style.setProperty("--x",Math.cos(a)*r+"px");d.style.setProperty("--y",Math.sin(a)*r+"px");document.body.appendChild(d);setTimeout(function(n){n.remove()},850,d)}}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function parseD(s){var p=(s||"").split("-");return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null}
function expInfo(it){
var d=parseD(it.exp);if(!d||isNaN(d))return{cls:"",text:"📅 Add expiry date"};
var t=new Date();t.setHours(0,0,0,0);
var m3=new Date(t);m3.setMonth(m3.getMonth()+3);
var m6=new Date(t);m6.setMonth(m6.getMonth()+6);
var days=Math.round((d-t)/864e5),when,cls="";
if(days<0)when="Expired "+(-days)+(days===-1?" day":" days")+" ago";
else if(days===0)when="Expires today";
else if(days<=60)when=days+(days===1?" day":" days")+" left";
else{var mo=Math.floor(days/30.44);when=mo+" months left"}
if(d<=m3)cls="danger";else if(d<=m6)cls="warn";
var nice=d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
return{cls:cls,text:(cls==="danger"?"🔴 ":cls==="warn"?"🟡 ":"📅 ")+nice+" · "+when}}
function render(){
var cats=["All"],term=$("q").value.toLowerCase();
items.forEach(function(it){if(cats.indexOf(it.cat)<0)cats.push(it.cat)});
if(cats.indexOf(filter)<0)filter="All";
$("chips").innerHTML="";
cats.forEach(function(c){var b=document.createElement("button");b.className="chip"+(c===filter?" on":"");b.textContent=c;b.onclick=function(){filter=c;render()};$("chips").appendChild(b)});
var shown=items.filter(function(it){return(filter==="All"||it.cat===filter)&&it.name.toLowerCase().indexOf(term)>-1});
var total=items.reduce(function(a,b){return a+b.n},0);
$("count").textContent=items.length+(items.length===1?" item · ":" items · ")+total+" total";
var ul=$("list");ul.innerHTML="";
if(!shown.length){ul.innerHTML='<div class="empty"><span class="big">🪄</span>'+(items.length?"Nothing matches that search.":"Nothing here yet. Add your first item above.")+"</div>";return}
shown.forEach(function(it,i){
var li=document.createElement("li");li.style.animationDelay=Math.min(i,8)*.05+"s";
var parts=it.cat.split(" "),ei=expInfo(it);
if(ei.cls)li.className=ei.cls;
li.innerHTML='<span class="emo">'+parts[0]+'</span><div class="info"><b>'+esc(it.name)+'</b><small>'+esc(parts.slice(1).join(" "))+'</small><br><label class="exp">'+ei.text+'<input type="date" aria-label="Expiry date for '+esc(it.name)+'" value="'+esc(it.exp||"")+'"></label></div><div class="qty"><button aria-label="Less">−</button><span>'+it.n+'</span><button aria-label="More">+</button></div><button class="del" aria-label="Remove '+esc(it.name)+'">🗑️</button>';
var b=li.querySelectorAll("button");
b[0].onclick=function(){if(it.n>1){it.n--;save();render()}else remove(it,li)};
b[1].onclick=function(){it.n++;save();render()};
b[2].onclick=function(){remove(it,li)};
li.querySelector(".exp input").onchange=function(){it.exp=this.value;save();render()};
ul.appendChild(li)})}
function remove(it,li){li.classList.add("out");setTimeout(function(){items=items.filter(function(x){return x!==it});save();render();bump()},430)}
function bump(){var c=$("count");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}
function add(){
var name=$("name").value.trim();
if(!name){$("name").focus();return}
var n=Math.max(1,parseInt($("qty").value)||1),cat=$("cat").value,exp=$("exp").value||"",ex=items.filter(function(x){return x.name.toLowerCase()===name.toLowerCase()&&x.cat===cat&&(x.exp||"")===exp})[0];
if(ex)ex.n+=n;else items.unshift({name:name,n:n,cat:cat,exp:exp});
save();$("name").value="";$("qty").value=1;$("exp").value="";render();bump();
var r=$("addBtn").getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2)}
$("addBtn").onclick=add;
$("bk").onclick=backup;$("rs").onclick=function(){$("fi").click()};
$("fi").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(Array.isArray(d)){items=d.filter(function(x){return x&&x.name&&x.n});save();render()}}catch(e){}};r.readAsText(f)};
save();
$("name").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
$("q").addEventListener("input",render);
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
